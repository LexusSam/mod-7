{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Alke Wallet{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'gestion/css/styles.css' %}">
</head>

<body>

    <header class="navbar">
        <div class="container navbar-content">

            <a href="{% url 'cliente-list' %}" class="brand">
                Alke Wallet
            </a>

            <nav class="nav-links">
                <a href="{% url 'cliente-list' %}">
                    Clientes
                </a>

                <a href="{% url 'cuenta-list' %}">
                    Cuentas
                </a>

                <a href="{% url 'transaccion-list' %}">
                    Transacciones
                </a>

                <a href="{% url 'cliente-create' %}" class="btn btn-primary">
                    Nuevo cliente
                </a>
            </nav>

        </div>
    </header>


    <main class="container main-content">

        {% block content %}
        {% endblock %}

    </main>


    <footer class="footer">
        <div class="container">
            <p>Alke Wallet &copy; 2026</p>
        </div>
    </footer>

</body>
</html>
