{% extends "base.html" %}

{% block title %}
Nueva cuenta
{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1>Nueva cuenta</h1>
        <p>Registra una nueva cuenta para un cliente.</p>
    </div>
</div>

<div class="card form-card">
    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">
                Guardar cuenta
            </button>

            <a href="{% url 'cuenta-list' %}" class="btn btn-secondary">
                Cancelar
            </a>
        </div>
    </form>
</div>
{% endblock %}
